appId: dev.echohello.pidex
productName: pidex
copyright: Copyright © echohello-dev
artifactName: ${productName}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - assets/icon.png

mac:
  category: public.app-category.developer-tools
  icon: assets/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: ${productName}-mac-${arch}.${ext}

win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: true
  perMachine: false
  artifactName: ${productName}-win-${arch}.${ext}

portable:
  artifactName: ${productName}-win-${arch}-portable.${ext}

linux:
  icon: assets/icon.png
  category: Development
  synopsis: Desktop workbench for the Pi coding agent
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: dir
      arch: [x64]

appImage:
  artifactName: ${productName}-linux-${arch}.${ext}

deb:
  artifactName: ${productName}-linux-${arch}.${ext}
